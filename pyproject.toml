[project]
name = "graphatom"
version = "0.1.0"
description = "Noyau d'exécution durable pour agents LLM — machine à états persistante, tâches isolées, effets réconciliables"
readme = "README.md"
authors = [
    { name = "Acid3croco", email = "acid3croco@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.4",
]

[project.scripts]
graphatom = "graphatom.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
