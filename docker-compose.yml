# GraphAtom sur son propre repo : db + ordonnanceur + canal github + canal web
# + le front Next.js, seul service à la bordure.
#
#   GITHUB_TOKEN=$(gh auth token) docker compose up -d --build
#
# La config de cette instance vit dans le `.env` commité à côté, que compose
# lit tout seul : un redéploiement ne dépend d'aucune variable du shell qui
# l'invoque, le token excepté. Les défauts ci-dessous restent ceux d'un
# déploiement générique.
#
# Puis : poser le label `graphatom` sur une issue du repo. Le rail admet,
# pose sa question en commentaire, attend `/answer <id> <option>`, route,
# et rapporte le terminal — chaque prise de parole étant un effet réconciliable.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: graphatom
      POSTGRES_PASSWORD: graphatom
      POSTGRES_DB: graphatom
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54322:5432"   # pour un worker hôte (agents CLI, navigateur headless)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphatom"]
      interval: 2s
      timeout: 2s
      retries: 15

  init:
    build: .
    command: graphatom init-db
    environment: &env
      GRAPHATOM_DSN: postgresql://graphatom:graphatom@db:5432/graphatom
    depends_on:
      db:
        condition: service_healthy

  # l'ordonnanceur conteneurisé convient aux graphs à stubs ; les graphs à
  # agents (claude, chromium headless) demandent un worker sur l'hôte :
  #   GRAPHATOM_DSN=postgresql://graphatom:graphatom@127.0.0.1:54322/graphatom \
  #   GRAPHATOM_AGENT_DSN=<instance jetable> GRAPHATOM_REPO_DIR=<clone de référence> graphatom run
  #
  # GRAPHATOM_AGENT_DSN désigne une instance, pas une base : chaque item y
  # reçoit la sienne, graphatom_test_item_<id>, créée à la volée et droppée
  # par son cleanup. Le rôle doit donc avoir CREATEDB sur cette instance —
  # c'est le cas de `graphatom`, POSTGRES_USER du conteneur ci-dessus.
  #
  # GRAPHATOM_REPO_DIR est le clone de référence, pas l'atelier : code-task y
  # crée un worktree par item (.worktrees/rail-item-N) et le retire à la sortie.
  # Rien de ce qu'un agent lance ne doit voir ces deux valeurs-là : les
  # scripts de test épinglent les leurs (voir README, « hermétisme »).
  scheduler:
    profiles: ["stub"]
    build: .
    command: graphatom run
    environment: *env
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully

  github-sync:
    build: .
    command: graphatom github-sync --repo ${GRAPHATOM_REPO:-Acid3croco/graphatom} --graph ${GRAPHATOM_GRAPH:-examples/code-task.json}
    environment:
      <<: *env
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN requis}
      GRAPHATOM_ANSWERERS: ${GRAPHATOM_ANSWERERS:-Acid3croco}
      GRAPHATOM_TAKE_ALL: ${GRAPHATOM_TAKE_ALL:-}
      GRAPHATOM_WEB_URL: ${GRAPHATOM_WEB_URL:-http://127.0.0.1:8850}
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro   # les workspaces du worker hôte — la question de
                              # review y lit le `validate.md` qu'elle cite
    depends_on:
      init:
        condition: service_completed_successfully

  # Le canal web stdlib : l'API JSON que lit `front`, l'unique porte
  # d'écriture (`POST /answer`), la route des fichiers de workspace, et le
  # canal de secours en HTML. Il n'est plus à la bordure — pas de `proxy`,
  # pas de labels Traefik — mais reste joignable en local sur 8850 : c'est
  # ce qui reste debout le jour où le front ne builde pas.
  web:
    build: .
    command: graphatom serve --host 0.0.0.0 --port 8848
    environment: *env
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro   # les workspaces du worker hôte — previews en lecture seule
    ports:
      - "127.0.0.1:8850:8848"
    networks: [default]   # plus `proxy` : l'API est interne, seul `front` est public
    depends_on:
      init:
        condition: service_completed_successfully

  # Le front Next.js : le service public. Il ne parle qu'à l'API de `web`,
  # par le réseau interne du compose — d'où `GRAPHATOM_API_URL` en nom de
  # service. Les labels ci-dessous déclarent le routeur de bordure ; ils ne
  # servent qu'à un Traefik qui lit les labels docker (voir README).
  front:
    build: ./front
    environment:
      GRAPHATOM_API_URL: http://web:8848
    restart: unless-stopped
    ports:
      - "127.0.0.1:8851:3000"
    networks: [default, proxy]   # `proxy` : voir plus bas
    labels:
      traefik.enable: "true"
      traefik.http.routers.graphatom-front.rule: Host(`graphatom.veyxzer.com`)
      traefik.http.services.graphatom-front.loadbalancer.server.port: "3000"
      traefik.docker.network: ${GRAPHATOM_PROXY_NET:-graphatom-proxy}
    depends_on:
      - web

networks:
  default:

  # Le réseau du proxy qui expose le front. Déclaré ici pour survivre à
  # `up -d` : un `docker network connect` posé à la main se perd dès que le
  # conteneur est recréé — panne silencieuse. Par défaut compose crée son
  # propre réseau, donc aucun prérequis ; l'instance qui vit derrière un
  # proxy déjà en place le nomme dans son `.env` avec EXTERNAL=true.
  proxy:
    name: ${GRAPHATOM_PROXY_NET:-graphatom-proxy}
    external: ${GRAPHATOM_PROXY_NET_EXTERNAL:-false}

volumes:
  pgdata:
