# GraphAtom sur son propre repo : db + ordonnanceur + canal github + canal web.
#
#   GITHUB_TOKEN=$(gh auth token) docker compose up -d --build
#
# Puis : poser le label `graphatom` sur une issue du repo. Le rail admet,
# pose sa question en commentaire, attend `/answer <id> <option>`, route,
# et rapporte le terminal — chaque prise de parole étant un effet réconciliable.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: graphatom
      POSTGRES_PASSWORD: graphatom
      POSTGRES_DB: graphatom
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54322:5432"   # pour un worker hôte (agents CLI, navigateur headless)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphatom"]
      interval: 2s
      timeout: 2s
      retries: 15

  init:
    build: .
    command: graphatom init-db
    environment: &env
      GRAPHATOM_DSN: postgresql://graphatom:graphatom@db:5432/graphatom
    depends_on:
      db:
        condition: service_healthy

  # l'ordonnanceur conteneurisé convient aux graphs à stubs ; les graphs à
  # agents (claude, chromium headless) demandent un worker sur l'hôte :
  #   GRAPHATOM_DSN=postgresql://graphatom:graphatom@127.0.0.1:54322/graphatom \
  #   GRAPHATOM_AGENT_DSN=<base jetable> GRAPHATOM_REPO_DIR=<repo> graphatom run
  scheduler:
    profiles: ["stub"]
    build: .
    command: graphatom run
    environment: *env
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully

  github-sync:
    build: .
    command: graphatom github-sync --repo ${GRAPHATOM_REPO:-Acid3croco/graphatom} --graph ${GRAPHATOM_GRAPH:-examples/code-task.json}
    environment:
      <<: *env
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN requis}
      GRAPHATOM_ANSWERERS: ${GRAPHATOM_ANSWERERS:-Acid3croco}
      GRAPHATOM_TAKE_ALL: ${GRAPHATOM_TAKE_ALL:-}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully

  web:
    build: .
    command: graphatom serve --host 0.0.0.0 --port 8848
    environment: *env
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro   # les workspaces du worker hôte — previews en lecture seule
    ports:
      - "127.0.0.1:8850:8848"
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  pgdata:
